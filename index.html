<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UAP Watch SEA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#060810;
  --surface:#0c0f1a;
  --card:#0f1320;
  --border:#1a2040;
  --accent:#00f5c4;
  --accent2:#4d9fff;
  --alert:#ff4d6d;
  --text:#e8eeff;
  --muted:#4a5580;
  --muted2:#2a3355;
}

html{scroll-behavior:smooth;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

/* ── Starfield ── */
.starfield{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 8%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 65%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 22%, rgba(255,255,255,0.6) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(2px 2px at 35% 55%, rgba(77,159,255,0.4) 0%, transparent 100%),
    radial-gradient(2px 2px at 75% 35%, rgba(0,245,196,0.3) 0%, transparent 100%);
}

/* ── Layout ── */
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;}

/* ── Top Nav ── */
.topnav{
  position:sticky;top:0;z-index:100;
  background:rgba(6,8,16,0.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}

.logo{
  font-family:'Space Mono',monospace;
  font-size:15px;font-weight:700;
  color:var(--accent);
  letter-spacing:0.05em;
  display:flex;align-items:center;gap:8px;
}

.logo-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.8);}
}

.live-badge{
  font-family:'Space Mono',monospace;
  font-size:9px;font-weight:700;
  color:var(--alert);
  border:1px solid var(--alert);
  border-radius:4px;
  padding:2px 6px;
  letter-spacing:0.1em;
  animation:flashBadge 2s infinite;
}

@keyframes flashBadge{0%,100%{opacity:1;}50%{opacity:0.5;}}

.nav-right{display:flex;align-items:center;gap:10px;}

.post-btn{
  background:var(--accent);color:#060810;
  border:none;border-radius:8px;
  padding:8px 14px;
  font-family:'Outfit',sans-serif;
  font-size:13px;font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;align-items:center;gap:5px;
}
.post-btn:hover{background:#00ddb0;transform:translateY(-1px);}

/* ── Stats Bar ── */
.stats-bar{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}

.stat{
  flex:1;text-align:center;
  padding:12px 8px;
  border-right:1px solid var(--border);
}
.stat:last-child{border-right:none;}

.stat-num{
  font-family:'Space Mono',monospace;
  font-size:18px;font-weight:700;
  color:var(--accent);
  display:block;
}
.stat-label{
  font-size:9px;font-weight:500;
  color:var(--muted);
  letter-spacing:0.1em;
  text-transform:uppercase;
  display:block;margin-top:2px;
}

/* ── Feed ── */
.feed{padding:0 0 100px;}

/* ── Sighting Card ── */
.sighting-card{
  border-bottom:1px solid var(--border);
  animation:fadeUp 0.4s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

.card-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px 10px;
}

.avatar{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:#060810;
  flex-shrink:0;
  box-shadow:0 0 12px rgba(0,245,196,0.2);
}

.card-meta{flex:1;}

.username{
  font-weight:600;font-size:14px;color:var(--text);
  display:flex;align-items:center;gap:6px;
}

.location-tag{
  font-family:'Space Mono',monospace;
  font-size:10px;color:var(--accent2);
  background:rgba(77,159,255,0.1);
  border:1px solid rgba(77,159,255,0.2);
  border-radius:4px;padding:1px 5px;
}

.timestamp{
  font-size:11px;color:var(--muted);margin-top:2px;
}

.alert-level{
  font-family:'Space Mono',monospace;
  font-size:9px;font-weight:700;
  padding:3px 7px;border-radius:4px;
  letter-spacing:0.1em;
}
.alert-low{color:#00f5c4;background:rgba(0,245,196,0.1);border:1px solid rgba(0,245,196,0.2);}
.alert-med{color:#ffd60a;background:rgba(255,214,10,0.1);border:1px solid rgba(255,214,10,0.2);}
.alert-high{color:#ff4d6d;background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.2);animation:flashBadge 1.5s infinite;}

/* ── Photo ── */
.card-photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:var(--card);
  position:relative;
}

.photo-placeholder{
  width:100%;aspect-ratio:1/1;
  background:var(--card);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:13px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}

.photo-placeholder::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 30% 40%, rgba(0,245,196,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(77,159,255,0.04) 0%, transparent 60%);
}

.photo-orb{
  font-size:48px;
  filter:drop-shadow(0 0 20px rgba(0,245,196,0.4));
}

.photo-wrap{position:relative;}

.photo-wrap img{
  width:100%;aspect-ratio:1/1;object-fit:cover;
  display:block;
}

/* ── AI Analysis Overlay ── */
.ai-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent, rgba(6,8,16,0.95));
  padding:32px 14px 14px;
}

.ai-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Space Mono',monospace;
  font-size:10px;font-weight:700;
  color:var(--accent);
  background:rgba(0,245,196,0.1);
  border:1px solid rgba(0,245,196,0.3);
  border-radius:4px;padding:3px 8px;
  margin-bottom:6px;
}

.ai-analysis{
  font-size:12px;line-height:1.5;
  color:rgba(232,238,255,0.85);
}

/* ── Actions ── */
.card-actions{
  display:flex;align-items:center;gap:16px;
  padding:12px 16px 8px;
}

.action-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;gap:5px;
  color:var(--muted);font-size:13px;font-weight:500;
  font-family:'Outfit',sans-serif;
  transition:all 0.2s;padding:0;
}
.action-btn:hover{color:var(--text);}
.action-btn.liked{color:var(--alert);}
.action-btn svg{transition:transform 0.2s;}
.action-btn:hover svg{transform:scale(1.15);}

.action-btn.liked svg{fill:var(--alert);stroke:var(--alert);}

.spacer{flex:1;}

.share-btn{
  background:none;border:none;cursor:pointer;
  color:var(--muted);
  transition:color 0.2s;
}
.share-btn:hover{color:var(--text);}

/* ── Description ── */
.card-desc{
  padding:0 16px 8px;
  font-size:13px;line-height:1.5;color:rgba(232,238,255,0.8);
}

.card-desc strong{color:var(--text);font-weight:600;}

/* ── Comments ── */
.comments-section{padding:0 16px 12px;}

.comment{
  display:flex;gap:8px;margin-bottom:8px;
  animation:fadeUp 0.3s ease;
}

.comment-avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--muted2),var(--muted));
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--text);flex-shrink:0;
}

.comment-body{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;padding:7px 10px;
  font-size:12px;line-height:1.4;
  flex:1;
}

.comment-user{
  font-weight:600;color:var(--accent2);
  font-size:11px;margin-bottom:2px;
}

.comment-text{color:rgba(232,238,255,0.75);}

.ai-comment .comment-avatar{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.ai-comment .comment-body{
  border-color:rgba(0,245,196,0.2);
  background:rgba(0,245,196,0.04);
}

.ai-comment .comment-user{color:var(--accent);}

/* ── Comment Input ── */
.comment-input-row{
  display:flex;gap:8px;align-items:center;
  margin-top:4px;
}

.comment-input{
  flex:1;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 14px;
  font-family:'Outfit',sans-serif;
  font-size:12px;color:var(--text);
  outline:none;
  transition:border-color 0.2s;
}
.comment-input:focus{border-color:rgba(0,245,196,0.4);}
.comment-input::placeholder{color:var(--muted);}

.send-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.send-btn:hover{background:#00ddb0;transform:scale(1.05);}
.send-btn svg{width:14px;height:14px;stroke:#060810;stroke-width:2.5;fill:none;}

/* ── Modal: Post Sighting ── */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  background:rgba(6,8,16,0.92);
  backdrop-filter:blur(10px);
  display:none;align-items:flex-end;
  animation:fadeIn 0.2s ease;
}
.modal-bg.open{display:flex;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.modal{
  width:100%;max-width:480px;margin:0 auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px 24px 0 0;
  padding:20px 20px 40px;
  animation:slideUp 0.3s ease;
  max-height:90vh;overflow-y:auto;
}

@keyframes slideUp{
  from{transform:translateY(60px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-family:'Space Mono',monospace;
  font-size:14px;font-weight:700;color:var(--accent);
  letter-spacing:0.05em;
}

.close-btn{
  background:var(--surface);border:1px solid var(--border);
  border-radius:50%;width:32px;height:32px;
  cursor:pointer;color:var(--muted);font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.close-btn:hover{color:var(--text);border-color:var(--muted);}

.form-group{margin-bottom:16px;}

.form-label{
  font-size:11px;font-weight:600;
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;display:block;
}

.form-input,.form-select,.form-textarea{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 14px;
  font-family:'Outfit',sans-serif;
  font-size:14px;color:var(--text);
  outline:none;
  transition:border-color 0.2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:rgba(0,245,196,0.4);
}
.form-input::placeholder,.form-textarea::placeholder{color:var(--muted);}
.form-select{cursor:pointer;appearance:none;}
.form-textarea{resize:none;height:80px;line-height:1.5;}

/* Photo upload zone */
.upload-zone{
  border:2px dashed var(--border);
  border-radius:12px;
  padding:24px;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  background:var(--surface);
  position:relative;overflow:hidden;
}
.upload-zone:hover,.upload-zone.dragover{
  border-color:rgba(0,245,196,0.5);
  background:rgba(0,245,196,0.04);
}
.upload-zone input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
.upload-icon{font-size:32px;margin-bottom:8px;display:block;}
.upload-text{font-size:13px;color:var(--muted);line-height:1.4;}
.upload-preview{
  width:100%;border-radius:8px;
  max-height:200px;object-fit:cover;
  display:none;margin-top:12px;
}

/* AI analyzing spinner */
.ai-analyzing{
  display:none;
  align-items:center;gap:8px;
  font-size:12px;color:var(--accent);
  margin-top:10px;font-family:'Space Mono',monospace;
}
.ai-analyzing.show{display:flex;}

.spinner{
  width:14px;height:14px;
  border:2px solid rgba(0,245,196,0.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.ai-result-box{
  display:none;
  margin-top:10px;
  background:rgba(0,245,196,0.05);
  border:1px solid rgba(0,245,196,0.2);
  border-radius:10px;
  padding:12px;
  font-size:12px;line-height:1.5;
  color:rgba(232,238,255,0.85);
}
.ai-result-box.show{display:block;}
.ai-result-label{
  font-family:'Space Mono',monospace;
  font-size:10px;color:var(--accent);font-weight:700;
  margin-bottom:4px;
}

.alert-selector{
  display:flex;gap:8px;
}
.alert-opt{
  flex:1;text-align:center;
  border:1px solid var(--border);
  border-radius:8px;padding:8px 4px;
  cursor:pointer;font-size:11px;font-weight:600;
  transition:all 0.2s;color:var(--muted);
  background:var(--surface);
}
.alert-opt:hover,.alert-opt.selected{border-color:var(--accent);}
.alert-opt.selected{color:var(--accent);background:rgba(0,245,196,0.08);}

.submit-btn{
  width:100%;
  background:var(--accent);color:#060810;
  border:none;border-radius:12px;
  padding:14px;
  font-family:'Outfit',sans-serif;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:all 0.2s;
  margin-top:8px;
}
.submit-btn:hover{background:#00ddb0;transform:translateY(-1px);}
.submit-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* ── Empty feed ── */
.empty-feed{
  text-align:center;padding:60px 20px;
  color:var(--muted);
}
.empty-feed .orb{font-size:60px;margin-bottom:16px;
  filter:drop-shadow(0 0 20px rgba(0,245,196,0.3));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
.empty-feed p{font-size:14px;line-height:1.7;}

/* ── Toast ── */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#060810;
  font-weight:700;font-size:13px;
  padding:10px 20px;border-radius:20px;
  z-index:300;opacity:0;pointer-events:none;
  transition:opacity 0.3s;
  white-space:nowrap;
}
.toast.show{opacity:1;}

/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

</style>
</head>
<body>
<div class="starfield"></div>

<div class="app">

  <!-- Nav -->
  <nav class="topnav">
    <div class="logo">
      <div class="logo-dot"></div>
      UAP WATCH SEA
    </div>
    <div class="nav-right">
      <span class="live-badge">LIVE</span>
      <button class="post-btn" onclick="openModal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Report
      </button>
    </div>
  </nav>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-num" id="totalSightings">0</span>
      <span class="stat-label">Sightings</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="totalCountries">8</span>
      <span class="stat-label">Countries</span>
    </div>
    <div class="stat">
      <span class="stat-num" id="totalToday">0</span>
      <span class="stat-label">Today</span>
    </div>
  </div>

  <!-- Feed -->
  <div class="feed" id="feed">
    <div class="empty-feed" id="emptyFeed">
      <div class="orb">🛸</div>
      <p>No sightings reported yet.<br>Be the first to document what you saw.<br><br>
      <span style="color:var(--accent);font-weight:600;">Tap "Report" to submit a sighting.</span></p>
    </div>
  </div>

</div>

<!-- Post Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">// REPORT SIGHTING</span>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">Your Name / Handle</label>
      <input class="form-input" id="postUser" placeholder="e.g. WatcherKL_07" maxlength="30">
    </div>

    <div class="form-group">
      <label class="form-label">Location</label>
      <select class="form-select" id="postLocation">
        <option value="">Select location…</option>
        <optgroup label="Malaysia">
          <option>Kuala Lumpur, MY</option>
          <option>Penang, MY</option>
          <option>Johor Bahru, MY</option>
          <option>Kota Kinabalu, MY</option>
          <option>Kuching, MY</option>
        </optgroup>
        <optgroup label="Indonesia">
          <option>Jakarta, ID</option>
          <option>Bali, ID</option>
          <option>Surabaya, ID</option>
          <option>Medan, ID</option>
        </optgroup>
        <optgroup label="Thailand">
          <option>Bangkok, TH</option>
          <option>Chiang Mai, TH</option>
          <option>Phuket, TH</option>
        </optgroup>
        <optgroup label="Philippines">
          <option>Manila, PH</option>
          <option>Cebu, PH</option>
          <option>Davao, PH</option>
        </optgroup>
        <optgroup label="Singapore">
          <option>Singapore, SG</option>
        </optgroup>
        <optgroup label="Vietnam">
          <option>Hanoi, VN</option>
          <option>Ho Chi Minh City, VN</option>
        </optgroup>
        <optgroup label="Myanmar">
          <option>Yangon, MM</option>
          <option>Mandalay, MM</option>
        </optgroup>
        <optgroup label="Cambodia">
          <option>Phnom Penh, KH</option>
          <option>Siem Reap, KH</option>
        </optgroup>
        <optgroup label="Brunei">
          <option>Bandar Seri Begawan, BN</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Alert Level</label>
      <div class="alert-selector">
        <div class="alert-opt selected" data-level="LOW" onclick="selectAlert(this)">🟢 LOW</div>
        <div class="alert-opt" data-level="MEDIUM" onclick="selectAlert(this)">🟡 MEDIUM</div>
        <div class="alert-opt" data-level="HIGH" onclick="selectAlert(this)">🔴 HIGH</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Upload Photo / Screenshot</label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" accept="image/*" id="photoInput" onchange="handlePhoto(event)">
        <span class="upload-icon">📡</span>
        <div class="upload-text">Tap to upload or drag image here<br><span style="font-size:11px;color:var(--muted2)">JPG, PNG, GIF — max 10MB</span></div>
        <img class="upload-preview" id="uploadPreview">
      </div>
      <div class="ai-analyzing" id="aiAnalyzing">
        <div class="spinner"></div>
        AI analyzing image…
      </div>
      <div class="ai-result-box" id="aiResultBox">
        <div class="ai-result-label">⬡ AI ANALYSIS</div>
        <div id="aiResultText"></div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">What did you witness?</label>
      <textarea class="form-textarea" id="postDesc" placeholder="Describe the shape, movement, lights, sound, duration… be as specific as possible." maxlength="500"></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitSighting()">
      Transmit Sighting 🛸
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let sightings = [];
let selectedAlert = 'LOW';
let uploadedImageBase64 = null;
let aiAnalysisResult = null;

// ── Seed data ──
const seedSightings = [
  {
    id: 1,
    user: 'NightSky_KL',
    location: 'Kuala Lumpur, MY',
    alert: 'HIGH',
    desc: 'Triangular craft hovering silently above Bukit Bintang for about 4 minutes. Three white lights at each corner, one red pulsing light in the center. No sound whatsoever. Disappeared straight up at incredible speed.',
    image: null,
    aiAnalysis: 'Object exhibits classic triangular UAP configuration: three vertex lights + central pulsing emitter. Movement pattern inconsistent with known aircraft or drones. Recommend cross-referencing with RMAF radar data for the 22:40–22:44 UTC+8 window.',
    time: '2h ago',
    likes: 47,
    liked: false,
    comments: [
      { user: 'ObserverSG', text: 'I saw something similar near Sentosa last month. Same silent movement.', isAI: false },
      { user: '⬡ UAP-AI', text: 'Triangular UAP reports account for ~23% of all SEA sightings in our database. KL and Singapore corridors show elevated frequency.', isAI: true }
    ]
  },
  {
    id: 2,
    user: 'BaliWatcher99',
    location: 'Bali, ID',
    alert: 'MEDIUM',
    desc: 'Bright orb moving slowly across the sky then splitting into 3 separate lights. They moved independently for a while then rejoined and vanished. Watched for maybe 8 minutes. Phone camera couldn\'t capture it well.',
    image: null,
    aiAnalysis: 'Orb bifurcation behavior documented in multiple UAP encounters globally. The "splitting and rejoining" pattern is distinct from satellite, meteor, or conventional aircraft behavior. Atmospheric ionization or plasma phenomenon possible but does not account for controlled movement.',
    time: '5h ago',
    likes: 29,
    liked: false,
    comments: [
      { user: 'SkyHunter_JKT', text: 'This matches exactly what 3 of us saw from Seminyak beach last week!', isAI: false }
    ]
  },
  {
    id: 3,
    user: 'SilentObserver_PH',
    location: 'Manila, PH',
    alert: 'LOW',
    desc: 'Fast moving light, much faster than any plane, crossed the entire horizon in about 6 seconds. No trail. No sound. Perfect straight line trajectory then gone.',
    image: null,
    aiAnalysis: 'Estimated velocity based on horizon crossing time of 6 seconds suggests speeds exceeding 10,000 km/h at low altitude — beyond current known aircraft capabilities. Consistent with hypersonic UAP movement profiles reported globally.',
    time: '1d ago',
    likes: 18,
    liked: false,
    comments: []
  }
];

// ── Init ──
window.onload = () => {
  sightings = [...seedSightings];
  renderFeed();
  updateStats();
};

// ── Render ──
function renderFeed() {
  const feed = document.getElementById('feed');
  const emptyFeed = document.getElementById('emptyFeed');

  // Remove all cards but keep emptyFeed
  feed.querySelectorAll('.sighting-card').forEach(c => c.remove());

  if (sightings.length === 0) {
    emptyFeed.style.display = 'block';
    return;
  }
  emptyFeed.style.display = 'none';

  [...sightings].reverse().forEach(s => {
    feed.appendChild(buildCard(s));
  });
}

function buildCard(s) {
  const div = document.createElement('div');
  div.className = 'sighting-card';
  div.id = `card-${s.id}`;

  const alertClass = s.alert === 'HIGH' ? 'alert-high' : s.alert === 'MEDIUM' ? 'alert-med' : 'alert-low';
  const initials = s.user.slice(0,2).toUpperCase();
  const avatarColor = stringToColor(s.user);

  const photoHTML = s.image
    ? `<div class="photo-wrap">
        <img src="${s.image}" alt="UAP sighting">
        <div class="ai-overlay">
          <div class="ai-tag">⬡ AI ANALYSIS</div>
          <div class="ai-analysis">${escHtml(s.aiAnalysis)}</div>
        </div>
       </div>`
    : `<div class="photo-placeholder">
        <div class="photo-orb">🛸</div>
        <span>No photo submitted</span>
        ${s.aiAnalysis ? `<div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(6,8,16,0.95));padding:28px 14px 14px;">
          <div class="ai-tag">⬡ AI ANALYSIS</div>
          <div class="ai-analysis" style="font-size:12px;line-height:1.5;color:rgba(232,238,255,0.85);">${escHtml(s.aiAnalysis)}</div>
        </div>` : ''}
       </div>`;

  const commentsHTML = s.comments.map((c, i) => `
    <div class="comment ${c.isAI ? 'ai-comment' : ''}">
      <div class="comment-avatar">${c.isAI ? '⬡' : c.user.slice(0,2).toUpperCase()}</div>
      <div class="comment-body">
        <div class="comment-user">${escHtml(c.user)}</div>
        <div class="comment-text">${escHtml(c.text)}</div>
      </div>
    </div>`).join('');

  div.innerHTML = `
    <div class="card-header">
      <div class="avatar" style="background:${avatarColor}">${initials}</div>
      <div class="card-meta">
        <div class="username">
          ${escHtml(s.user)}
          <span class="location-tag">📍 ${escHtml(s.location)}</span>
        </div>
        <div class="timestamp">${s.time}</div>
      </div>
      <span class="alert-level ${alertClass}">${s.alert}</span>
    </div>
    ${photoHTML}
    <div class="card-actions">
      <button class="action-btn ${s.liked ? 'liked' : ''}" onclick="toggleLike(${s.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="${s.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span id="likes-${s.id}">${s.likes}</span>
      </button>
      <button class="action-btn" onclick="focusComment(${s.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span>${s.comments.length}</span>
      </button>
      <div class="spacer"></div>
      <button class="share-btn" onclick="shareCard(${s.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
      </button>
    </div>
    <div class="card-desc"><strong>${escHtml(s.user)}</strong> ${escHtml(s.desc)}</div>
    <div class="comments-section" id="comments-${s.id}">
      ${commentsHTML}
      <div class="comment-input-row">
        <input class="comment-input" id="cinput-${s.id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')postComment(${s.id})">
        <button class="send-btn" onclick="postComment(${s.id})">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  `;
  return div;
}

function updateStats() {
  document.getElementById('totalSightings').textContent = sightings.length;
  document.getElementById('totalToday').textContent = sightings.filter(s => s.time.includes('h') || s.time === 'just now').length;
}

// ── Actions ──
function toggleLike(id) {
  const s = sightings.find(x => x.id === id);
  if (!s) return;
  s.liked = !s.liked;
  s.likes += s.liked ? 1 : -1;
  const btn = document.querySelector(`#card-${id} .action-btn`);
  btn.classList.toggle('liked', s.liked);
  btn.querySelector('svg').setAttribute('fill', s.liked ? 'currentColor' : 'none');
  document.getElementById(`likes-${id}`).textContent = s.likes;
}

function postComment(id) {
  const input = document.getElementById(`cinput-${id}`);
  const text = input.value.trim();
  if (!text) return;

  const s = sightings.find(x => x.id === id);
  const comment = { user: 'You', text, isAI: false };
  s.comments.push(comment);

  const container = document.getElementById(`comments-${id}`);
  const inputRow = container.querySelector('.comment-input-row');

  const div = document.createElement('div');
  div.className = 'comment';
  div.innerHTML = `
    <div class="comment-avatar" style="background:linear-gradient(135deg,var(--accent2),var(--accent));color:#060810">YO</div>
    <div class="comment-body">
      <div class="comment-user">You</div>
      <div class="comment-text">${escHtml(text)}</div>
    </div>`;
  container.insertBefore(div, inputRow);
  input.value = '';

  // Update comment count
  const countEl = document.querySelector(`#card-${id} .action-btn:nth-child(2) span`);
  if (countEl) countEl.textContent = s.comments.length;
}

function focusComment(id) {
  document.getElementById(`cinput-${id}`)?.focus();
}

function shareCard(id) {
  showToast('Link copied to clipboard!');
}

// ── Modal ──
function openModal() {
  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow = '';
}

function selectAlert(el) {
  document.querySelectorAll('.alert-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedAlert = el.dataset.level;
}

// ── Photo handling ──
function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (ev) => {
    const base64 = ev.target.result;
    uploadedImageBase64 = base64;

    const preview = document.getElementById('uploadPreview');
    preview.src = base64;
    preview.style.display = 'block';

    // Show AI analyzing
    document.getElementById('aiAnalyzing').classList.add('show');
    document.getElementById('aiResultBox').classList.remove('show');

    // Call Claude AI to analyze the image
    await analyzeImageWithAI(base64, file.type);
  };
  reader.readAsDataURL(file);
}

async function analyzeImageWithAI(base64DataUrl, mimeType) {
  const base64Data = base64DataUrl.split(',')[1];
  const validType = (mimeType === 'image/jpeg' || mimeType === 'image/png' || mimeType === 'image/gif' || mimeType === 'image/webp') ? mimeType : 'image/jpeg';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are UAP-AI, an expert analyst for the UAP Watch SEA platform monitoring unidentified aerial phenomena in Southeast Asia. When given an image, analyze it for any aerial objects, lights, anomalies, or atmospheric phenomena. Provide a concise but detailed analysis in 2-3 sentences covering: what you observe, whether it matches known aircraft/natural phenomena, and any notable characteristics. Be scientific but accessible. If no UAP is visible, note what IS in the image and whether conditions would be conducive to observation. Always write in present tense as if analyzing live evidence. Respond with ONLY the analysis text, no preamble.`,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: validType, data: base64Data }
            },
            {
              type: 'text',
              text: 'Analyze this image for UAP activity or relevant atmospheric/aerial phenomena for our Southeast Asia monitoring database.'
            }
          ]
        }]
      })
    });

    const data = await response.json();
    const result = data.content?.[0]?.text || 'Analysis unavailable. Image logged for manual review.';

    aiAnalysisResult = result;
    document.getElementById('aiAnalyzing').classList.remove('show');
    document.getElementById('aiResultText').textContent = result;
    document.getElementById('aiResultBox').classList.add('show');

  } catch (err) {
    aiAnalysisResult = 'AI analysis temporarily offline. Sighting will be logged with manual review flag.';
    document.getElementById('aiAnalyzing').classList.remove('show');
    document.getElementById('aiResultText').textContent = aiAnalysisResult;
    document.getElementById('aiResultBox').classList.add('show');
  }
}

// ── Submit ──
async function submitSighting() {
  const user = document.getElementById('postUser').value.trim();
  const location = document.getElementById('postLocation').value;
  const desc = document.getElementById('postDesc').value.trim();

  if (!user) { showToast('Enter your handle first'); return; }
  if (!location) { showToast('Select a location'); return; }
  if (!desc) { showToast('Describe what you witnessed'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Transmitting…';

  // If no image but has description, get AI analysis of the description
  let analysisText = aiAnalysisResult;
  if (!analysisText) {
    analysisText = await analyzeDescriptionWithAI(desc, location);
  }

  const newSighting = {
    id: Date.now(),
    user,
    location,
    alert: selectedAlert,
    desc,
    image: uploadedImageBase64,
    aiAnalysis: analysisText,
    time: 'just now',
    likes: 0,
    liked: false,
    comments: []
  };

  sightings.push(newSighting);

  // Reset form
  document.getElementById('postUser').value = '';
  document.getElementById('postLocation').value = '';
  document.getElementById('postDesc').value = '';
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('aiResultBox').classList.remove('show');
  document.getElementById('aiAnalyzing').classList.remove('show');
  uploadedImageBase64 = null;
  aiAnalysisResult = null;
  selectedAlert = 'LOW';
  document.querySelectorAll('.alert-opt').forEach((o,i) => o.classList.toggle('selected', i===0));

  btn.disabled = false;
  btn.textContent = 'Transmit Sighting 🛸';

  closeModal();
  renderFeed();
  updateStats();
  showToast('Sighting transmitted. 🛸');
}

async function analyzeDescriptionWithAI(desc, location) {
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are UAP-AI, an expert analyst for UAP Watch SEA. Analyze UAP sighting descriptions from Southeast Asia. Provide a concise 2-3 sentence analysis covering: plausibility assessment, comparison to known phenomena, and notable characteristics. Be scientific but accessible. Respond with ONLY the analysis text.`,
        messages: [{
          role: 'user',
          content: `Analyze this UAP sighting reported from ${location}: "${desc}"`
        }]
      })
    });
    const data = await response.json();
    return data.content?.[0]?.text || 'Sighting logged. AI analysis pending manual review.';
  } catch {
    return 'Sighting logged. AI analysis pending manual review.';
  }
}

// ── Helpers ──
function escHtml(str) {
  return String(str).replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])
  );
}

function stringToColor(str) {
  let hash = 0;
  for (let c of str) hash = c.charCodeAt(0) + ((hash << 5) - hash);
  const colors = [
    'linear-gradient(135deg,#00f5c4,#4d9fff)',
    'linear-gradient(135deg,#ff4d6d,#ff9a3c)',
    'linear-gradient(135deg,#a855f7,#4d9fff)',
    'linear-gradient(135deg,#ffd60a,#ff9a3c)',
    'linear-gradient(135deg,#00f5c4,#a855f7)',
  ];
  return colors[Math.abs(hash) % colors.length];
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modal on bg click
document.getElementById('modalBg').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
</body>
</html>
